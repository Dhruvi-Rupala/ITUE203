<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - StudentHub</title>
    <link rel="stylesheet" href="style.css">

    <script>
        function validateForm() {
            let email = document.getElementById("email").value;
            let error = document.getElementById("errorMsg");

            // Email pattern
            let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (!email.match(pattern)) {
                error.innerText = "Please enter a valid email address";
                return false; // stop form submit
            } else {
                error.innerText = "";
                return true;
            }
        }
    </script>
</head>

<body>

<header>
    <div class="logo">
        <h2>StudentHub</h2>
    </div>

    <nav>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>
</header>

<section class="contact">

    <h1>Contact Us</h1>

    <div class="contact-info">
        <p><strong> Address:</strong> Charusat University, Changa, Anand, Gujarat</p>
        <p><strong> Phone:</strong> +91 xxxxxxxxxx</p>
        <p><strong> Email:</strong> studenthub@charusat.ac.in</p>
    </div>

    <form onsubmit="return validateForm()">
        <input type="text" placeholder="Enter Your Name" required>

        <input type="email" id="email" placeholder="Enter Your Email" required>
        <span id="errorMsg" style="color:red;"></span>

        <textarea rows="6" placeholder="Enter Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>

</section>

<footer>
    <p>© 2026 StudentHub Portal | All Rights Reserved</p>
</footer>

</body>
</html>
